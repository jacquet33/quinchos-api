version: "3.9"

# ═══════════════════════════════════════════════
# QuinchosAPI - Se engancha al Traefik existente
# ═══════════════════════════════════════════════

services:
  # ─── PostgreSQL (solo accesible internamente) ───
  quinchos-db:
    image: postgres:16-alpine
    container_name: quinchos-db
    restart: always
    environment:
      POSTGRES_DB: quinchos
      POSTGRES_USER: quinchos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - quinchos-pgdata:/var/lib/postgresql/data
    networks:
      - quinchos-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quinchos_user -d quinchos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Node.js ───
  quinchos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quinchos-api
    restart: always
    depends_on:
      quinchos-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://quinchos_user:${POSTGRES_PASSWORD}@quinchos-db:5432/quinchos?schema=public
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: "*"
      UPLOAD_DIR: /app/uploads
    volumes:
      - quinchos-uploads:/app/uploads
    networks:
      - quinchos-internal
      - traefik-public      # Se conecta al Traefik existente
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.quinchos-api.rule=Host(`quinchos.art3d-studio.com.ar`)"
      - "traefik.http.routers.quinchos-api.entrypoints=websecure"
      - "traefik.http.routers.quinchos-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.quinchos-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

volumes:
  quinchos-pgdata:
  quinchos-uploads:
    driver: local

networks:
  quinchos-internal:
    driver: bridge
  traefik-public:
    external: true    # Usa la red que ya existe
